<!doctype html>
<html><head>
<script>
  // GitHub Pages SPA redirect: forward the path into the main app via sessionStorage
  var l = window.location;
  sessionStorage.redirect = l.href;
  l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 2).join('/') + '/?p=' + l.pathname.slice(1).replace(/&/g, '~and~') + (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
</script>
</head><body></body></html>
